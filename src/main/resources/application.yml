server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: contra-order-management
  datasource:
    url: jdbc:h2:file:${DB_FILE:./data/oms};AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
oms:
  jira:
    base-url: ${JIRA_BASE_URL:}
    site-url: ${JIRA_SITE_URL:}
    email: ${JIRA_EMAIL:}
    api-token: ${JIRA_API_TOKEN:}
    project-key: ${JIRA_PROJECT_KEY:OM2}
    board-id: ${JIRA_BOARD_ID:}
  payment:
    max-retries: ${MAX_PAYMENT_RETRIES:3}
  demo-mode: ${DEMO_MODE:false}
  orders:
    stuck-threshold-hours: ${STUCK_ORDER_HOURS:24}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
